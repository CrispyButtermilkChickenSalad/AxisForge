# All three services use identical paths for colcon entry points and calibration.
x-axisforge-runtime: &axisforge-runtime
  image: axisforge-dev:latest
  build:
    context: .
    args:
      DEV_UID: ${LOCAL_UID:-1000}
      DEV_GID: ${LOCAL_GID:-1000}
  init: true
  restart: unless-stopped
  working_dir: /workspace
  # Linux host networking supports ROS DDS discovery and the UR reverse ports.
  network_mode: host
  ipc: host
  environment: &ros-environment
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-0}
    ROBOT_IP: ${ROBOT_IP:-192.168.0.100}
  volumes:
    - type: bind
      source: .
      target: /workspace

services:
  dev:
    <<: *axisforge-runtime
    stdin_open: true
    tty: true

  # Optional dashboard stack; neither service starts the UR driver or live printing.
  rosbridge:
    <<: *axisforge-runtime
    profiles: [klipper]
    command:
      - ros2
      - launch
      - rosbridge_server
      - rosbridge_websocket_launch.xml
      - address:=127.0.0.1
      - port:=${ROSBRIDGE_PORT:-9090}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', ${ROSBRIDGE_PORT:-9090}), timeout=2).close()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  sync-worker:
    <<: *axisforge-runtime
    profiles: [klipper]
    environment:
      <<: *ros-environment
      AXISFORGE_SYNC_ENABLE: ${AXISFORGE_SYNC_ENABLE:-0}
      AXISFORGE_SYNC_PORT: ${AXISFORGE_SYNC_PORT:-8081}
      AXISFORGE_CONFIG: /workspace/src/axisforge_bringup/config/ur_master.yaml
    command: [bash, /workspace/docker/sync-worker.sh]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${AXISFORGE_SYNC_PORT:-8081}/status', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

  bridge:
    <<: *axisforge-runtime
    profiles: [klipper]
    depends_on:
      rosbridge:
        condition: service_healthy
      sync-worker:
        condition: service_healthy
    environment:
      <<: *ros-environment
      MOONRAKER_URL: ${MOONRAKER_URL:-http://127.0.0.1:7125}
      MOONRAKER_API_KEY: ${MOONRAKER_API_KEY:-}
      ROSBRIDGE_URL: ws://127.0.0.1:${ROSBRIDGE_PORT:-9090}
      AXISFORGE_GCODE_ROOT: /workspace/src/print_control/gcode
      AXISFORGE_CONFIG: /workspace/src/axisforge_bringup/config/ur_master.yaml
      AXISFORGE_SYNC_URL: http://127.0.0.1:${AXISFORGE_SYNC_PORT:-8081}
      HEATER_CHECK_TIMEOUT_S: ${HEATER_CHECK_TIMEOUT_S:-300}
      BRIDGE_PORT: ${BRIDGE_PORT:-8080}
      FLUIDD_URL: ${FLUIDD_URL:-}
      MAINSAIL_URL: ${MAINSAIL_URL:-}
      PRINTER_UI_URL: ${PRINTER_UI_URL:-}
      ALPS_LOGGER_URL: ${ALPS_LOGGER_URL:-https://crispybuttermilkchickensalad.github.io/ALPS-logger/}
    command: [axisforge-bridge]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${BRIDGE_PORT:-8080}/api/jobs', timeout=2).close()"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s

  # Optional serial bridge: no board is required to start the dev service.
  # This provides the Docker equivalent of scripts/microros.sh.
  micro-ros:
    image: microros/micro-ros-agent:humble
    profiles: [hardware]
    init: true
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-0}
    devices:
      - "${MICROROS_DEVICE:-/dev/ttyACM0}:/dev/ttyACM0"
    command: [serial, --dev, /dev/ttyACM0, -b, "${MICROROS_BAUD:-115200}"]
