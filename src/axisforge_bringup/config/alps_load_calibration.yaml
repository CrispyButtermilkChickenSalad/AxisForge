# Raw counts only. Before contact, select max(8000, ceil(factor * peak-to-peak
# noise)), capped at 20000. Factor is 4.1 cold or 2.5625 for explicitly hot
# calibration; drift and unloaded-load guards still apply. Commissioning values.
contact:
  trigger_mode: raw
  contact_delta_counts: 20000.0
  max_delta_counts: 120000.0
  step_mm: 0.01
  speed_mm_s: 0.1
  retract_mm: 5.0
  consecutive_samples: 5
homing:
  confirmation_timeout_s: 300.0
  heartbeat_timeout_s: 5.0
